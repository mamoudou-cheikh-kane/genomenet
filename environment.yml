# Environnement du pipeline bioinformatique (pas nécessaire pour lancer l'application)
# mlst est installé à part (environment-mlst.yml) pour éviter un conflit de versions Perl
name: genomenet-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - ncbi-datasets-cli
  - mash
  - ncbi-amrfinderplus
  - unzip
